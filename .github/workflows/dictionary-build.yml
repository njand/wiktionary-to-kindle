name: Build and Release Dictionaries

on:
  schedule:
    # Sundays at 14:14 UTC: Kaikki posts its weekly dump on Sunday morning (08:19 UTC on
    # 2026-10-25), and GitHub starts scheduled runs hours late, so an earlier cron built
    # from the week before's data. Off the hour to avoid the queue there.
    - cron: '14 14 * * 0'
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI
    inputs:
      allow_coverage_drop:
        description: Allow a coverage drop (publish a build whose coverage fell since the latest release)
        type: boolean
        default: false

env:
  KINDLING_VERSION: v0.45.6
  KINDLING_SHA256: 417ad6dad4b1072fabb20610f320ba44ca8f4afcbe2f47948dcefc3955bd6439
  # Abort the build when an entry cannot be found in the text (a blank popup on device)
  KINDLING_STRICT_ENTRIES: "1"

# Read-only by default; only the release job may write
permissions:
  contents: read

jobs:
  # Kaikki usually posts a new dump weekly but not always, and a build from the same dump
  # only adds a release that differs in its date, so a scheduled run stops here when the
  # dump is the one latest-build was made from. A manual run always builds.
  check-dump:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.dump.outputs.date }}
      build: ${{ steps.dump.outputs.build }}
    steps:
      - name: Compare Kaikki's dump with the latest build's
        id: dump
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          url=https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz
          modified=$(curl -fsSI -A "wiktionary-to-kindle (+https://github.com/$GITHUB_REPOSITORY)" "$url" | tr -d "\r" | sed -n "s/^[Ll]ast-[Mm]odified: //p")
          date=$(date -u -d "$modified" +%F)
          built=$(gh release download latest-build --repo "$GITHUB_REPOSITORY" --pattern dump-date.txt --output - 2>/dev/null || true)
          echo "Kaikki's dump: $date; latest build's: ${built:-none}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ] || [ "$date" != "$built" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Kaikki's dump of $date was built already; nothing to do" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-dictionaries:
    needs: check-dump
    if: needs.check-dump.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Wiktionary language codes with a profile in wiktionary_to_kindle/languages/; each
        # finds its corpus, lookup list and device checklist by its code
        language: ["la", "grc", "tr"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep pigz

      - name: Install kindling
        # Pinned, and checked against the release's SHA-256, so a new kindling release
        # cannot change a build unnoticed; bump both together after checking a build
        run: |
          curl -fsSLo kindling-cli "https://github.com/ciscoriordan/kindling/releases/download/${KINDLING_VERSION}/kindling-cli-linux"
          echo "${KINDLING_SHA256}  kindling-cli" | sha256sum --check
          chmod +x kindling-cli
          sudo mv kindling-cli /usr/local/bin/kindling-cli

      - name: Setup environment
        uses: astral-sh/setup-uv@v10.3.3 # setup-uv has no major-version tag since v8

      - name: Sync dependencies
        # --all-extras ensures the 'fast' orjson dependency is installed for the merge sort
        run: uv sync --all-extras

      - name: Audit codebase
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Build ${{ matrix.language }} Dictionary
        run: uv run wiktionary-to-kindle --lang "${{ matrix.language }}" --kindling kindling-cli --stardict

      - name: Measure ${{ matrix.language }} index
        run: >
          uv run python -m wiktionary_to_kindle.quality stats
          outputs/KindleDictionary-${{ matrix.language }}
          -o outputs/stats-${{ matrix.language }}.json

      - name: Measure ${{ matrix.language }} corpus coverage
        if: hashFiles(format('corpus/{0}.tsv', matrix.language)) != ''
        run: >
          uv run python -m wiktionary_to_kindle.quality coverage
          outputs/KindleDictionary-${{ matrix.language }} corpus/${{ matrix.language }}.tsv
          -o outputs/coverage-${{ matrix.language }}
          --lang ${{ matrix.language }}
          --kindling kindling-cli
          --mobi outputs/KindleDictionary-${{ matrix.language }}/${{ matrix.language }}-wiktionary.mobi

      # Turkish books are prepared (prepare-book) before reading; measure how such a book
      # reads, splitting by the stem of each word's lemma, since CI calls no model
      - name: Measure ${{ matrix.language }} prepared-book coverage
        if: matrix.language == 'tr'
        run: >
          uv run python scripts/measure_prepared.py
          outputs/KindleDictionary-tr corpus/tr.tsv --decide rooted
          > outputs/prepared-tr.md

      # Uploaded before the lookup check so a failing build can still be inspected
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dictionary-${{ matrix.language }}
          path: |
            outputs/KindleDictionary-${{ matrix.language }}/*.mobi
            outputs/KindleDictionary-${{ matrix.language }}/stardict/*.zip
            outputs/stats-${{ matrix.language }}.json
            outputs/coverage-${{ matrix.language }}.json
            outputs/coverage-${{ matrix.language }}.md
            outputs/prepared-${{ matrix.language }}.md

      - name: Check ${{ matrix.language }} lookups
        if: hashFiles(format('tests/lookup_words_{0}.txt', matrix.language)) != ''
        # kindling's `lookup` subcommand simulates a Paperwhite 5
        run: >
          uv run python scripts/check_lookups.py --kindling kindling-cli
          outputs/KindleDictionary-${{ matrix.language }}/${{ matrix.language }}-wiktionary.mobi
          tests/lookup_words_${{ matrix.language }}.txt

      # The latest release is the last one checked on a device (builds are published as
      # pre-releases, which `gh release download` skips), so coverage is compared with that
      - name: Compare ${{ matrix.language }} coverage with the latest release
        if: hashFiles(format('corpus/{0}.tsv', matrix.language)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LANG_CODE: ${{ matrix.language }}
          FAIL_ON_DROP: ${{ !inputs.allow_coverage_drop && '--fail-on-drop' || '' }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern "coverage-$LANG_CODE.json" --dir previous; then
            uv run python -m wiktionary_to_kindle.quality coverage-diff $FAIL_ON_DROP \
              "previous/coverage-$LANG_CODE.json" "outputs/coverage-$LANG_CODE.json"
          else
            echo "No coverage in the latest release to compare with"
          fi

  create-release:
    needs: [check-dump, build-dictionaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dictionaries
          merge-multiple: true

      - name: Download the latest release's statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'stats-*.json' --pattern 'coverage-*.json' --dir previous
          || echo "No statistics in the latest release"

      - name: Setup environment
        uses: astral-sh/setup-uv@v10.3.3

      # A table of every dictionary, with each one's details and device check folded away
      - name: Write release notes
        run: |
          echo "Built by GitHub Actions from ${GITHUB_SHA::7}. A pre-release until it is checked on a Kindle (each dictionary's device check is below)." > intro.md
          uv run python -m wiktionary_to_kindle.quality notes dictionaries --previous previous --intro intro.md > notes.md

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: "Dictionary Builds - ${{ steps.date.outputs.date }}"
          body_path: notes.md
          # Marked as the latest by hand after the device check (see the notes)
          prerelease: true
          # Artifacts keep their paths below outputs/, so the .mobi sits one folder down
          files: |
            dictionaries/**/*.mobi
            dictionaries/**/*-stardict.zip
            dictionaries/stats-*.json
            dictionaries/coverage-*.json

      # The README links to this release's files, so each language's newest build has a
      # download address that doesn't change from week to week
      - name: Update the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          {
            echo "The newest build of every dictionary, replaced each week. Dated releases keep each build; the one marked Latest has been checked on a Kindle."
            echo
            cat notes.md
          } > latest-notes.md
          if ! gh release view latest-build > /dev/null 2>&1; then
            gh release create latest-build --prerelease --title "Latest build (in testing)" --notes-file latest-notes.md
          fi
          echo "${{ needs.check-dump.outputs.date }}" > dump-date.txt
          gh release upload latest-build --clobber dictionaries/**/*.mobi dictionaries/**/*-stardict.zip dump-date.txt
          gh release edit latest-build --notes-file latest-notes.md
