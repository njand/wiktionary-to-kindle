name: Build and Release Dictionaries

on:
  schedule:
    # Runs at 2:14 AM UTC every Sunday to bypass top-of-the-hour queue bottlenecks
    - cron: '14 2 * * 0'
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build-dictionaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # To add languages, simply expand this array: ["la", "fr", "gr"]
        language: ["la"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep pigz

      - name: Install Kindling Compiler
        run: |
          wget -qO kindlegen https://github.com/ciscoriordan/kindling/releases/latest/download/kindling-cli-linux
          chmod +x kindlegen
          sudo mv kindlegen /usr/local/bin/kindlegen

      - name: Setup environment
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        # --all-extras ensures the 'fast' orjson dependency is installed for the merge sort
        run: uv sync --all-extras

      - name: Audit codebase
        run: uvx ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Build ${{ matrix.language }} Dictionary
        run: uv run wiktionary-to-kindle --lang "${{ matrix.language }}" --sort

      - name: Check ${{ matrix.language }} lookups
        if: hashFiles(format('tests/lookup_words_{0}.txt', matrix.language)) != ''
        # kindling was installed as `kindlegen`; its `lookup` subcommand simulates a Paperwhite 5
        run: >
          uv run python scripts/check_lookups.py --kindling kindlegen
          outputs/KindleDictionary-${{ matrix.language }}/${{ matrix.language }}-wiktionary.mobi
          tests/lookup_words_${{ matrix.language }}.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-${{ matrix.language }}
          path: outputs/KindleDictionary-${{ matrix.language }}/*.mobi

  create-release:
    needs: build-dictionaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish a GitHub Release
      
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dictionaries
          merge-multiple: true

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: "Dictionary Builds - ${{ steps.date.outputs.date }}"
          files: dictionaries/*.mobi