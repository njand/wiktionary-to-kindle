name: PR Checks

# Lint and tests only: the full dictionary build downloads the multi-GB dump and
# publishes a release, so it stays in dictionary-build.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: astral-sh/setup-uv@v10.3.3 # setup-uv has no major-version tag since v8

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Audit codebase
        # ruff is pinned in the dev group: a new release can reformat code that passed before
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
